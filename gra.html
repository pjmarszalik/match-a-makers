<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game · Match(a) Makers</title>
<meta name="description" content="Matcha and conversations with new people. Students' Room, Faculty of Physics, University of Warsaw.">
<meta property="og:title" content="Match(a) Makers">
<meta property="og:description" content="Matcha and conversations with new people. Students' Room, Faculty of Physics, University of Warsaw.">
<meta name="theme-color" content="#f7f2e6">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="game" data-title="nav.game">
<header id="site-header"></header>
<main>
<section class="game-wrap wrap" id="game-wrap">
  <h1 style="margin-bottom:8px" data-i18n="game.title"></h1>
  <div class="record-bar hidden" id="record-bar"></div>
  <div class="game-frame" id="game-frame">
    <canvas id="game"></canvas>
    <div class="frame-status hidden" id="frame-status" aria-hidden="true"><span></span></div>
    <form class="nick-panel hidden" id="nick-panel" autocomplete="off" novalidate>
      <div class="nick-card">
        <h2 class="nick-title" id="nick-title" data-i18n="game.who"></h2>
        <p class="nick-text" id="nick-text" data-i18n="game.whoText"></p>
        <div class="nick-row">
          <label class="sr-only" for="nick" data-i18n="game.nick"></label>
          <input id="nick" name="nick" type="text" maxlength="30" data-i18n-ph="game.nickPh" enterkeyhint="go" autocapitalize="words" autocorrect="off" spellcheck="false">
          <button class="btn green" type="submit" id="play-btn" data-i18n="game.play"></button>
        </div>
        <p class="nick-msg" id="nick-msg" aria-live="polite"></p>
        <button class="link-btn hidden" type="button" id="nick-cancel" data-i18n="game.cancel"></button>
      </div>
    </form>
  </div>
  <div class="player-bar hidden" id="player-bar">
    <p class="player-who"><span id="player-name"></span> <button class="link-btn" type="button" id="change-nick" data-i18n="game.changeNick"></button></p>
    <p class="player-status" id="player-status" aria-live="polite"></p>
  </div>
  <p class="game-help" data-i18n="game.help"></p>
  <div class="board-wrap hidden" id="board-wrap">
    <div class="board-head">
      <h2 data-i18n="game.board"></h2>
      <span class="board-count" id="board-count"></span>
    </div>
    <ol class="board" id="board"></ol>
    <button class="btn ghost board-more hidden" type="button" id="board-more" aria-controls="board" aria-expanded="false"></button>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/data/cups.js"></script>
<script src="gra/flappy.js"></script>
<script src="js/common.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/pages/game-page.js"></script>
</body>
</html>
